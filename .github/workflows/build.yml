name: Build AiFlex3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-aiflex3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid xz
          xcodebuild -version

      # 不再调用 update-theos：它会 init 全部子模块，其中 theos/orion 已不再公开，
      # clone 时会退化成询问 Username 并直接失败（构建挂在 Install Theos）。
      # 按 .gitmodules 只拉构建必需的头文件/lib，dm.pl 与 logos 允许缺失。
      # 注意 vendor/include 的真实仓库是 theos/headers，不能按目录名拼 URL。
      - name: Install Theos
        run: |
          set -eo pipefail
          git clone --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          cd "$RUNNER_TEMP/theos"
          git submodule update --init --depth 1 vendor/include vendor/lib
          git submodule update --init --depth 1 vendor/dm.pl || echo "warning: vendor/dm.pl 不可用"
          git submodule update --init --depth 1 vendor/logos || echo "warning: vendor/logos 不可用"
          chmod +x vendor/dm.pl/dm.pl 2>/dev/null || true
          mkdir -p sdks
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" sdks/iPhoneOS.sdk
          test -d vendor/include && test -d vendor/lib
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/vendor/dm.pl" >> "$GITHUB_PATH"

      - name: Fetch frida-gum devkit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          # 版本不写死：release 的 tag 会变，写死容易 404。
          VER=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/frida/frida/releases/latest | jq -r '.tag_name')
          echo "frida version: $VER"
          mkdir -p frida/vendor
          ASSET="frida-gum-devkit-${VER}-ios-arm64.tar.xz"
          rm -rf /tmp/gumdl && mkdir -p /tmp/gumdl

          # 匿名 GET /releases/download/... 会被 GitHub 限流成 403，
          # 所以主路径走 gh（认证 API），curl 只作为带 token 的兜底。
          if ! gh release download "$VER" --repo frida/frida --pattern "$ASSET" --dir /tmp/gumdl --clobber; then
            echo "gh release download 失败，改用带 token 的 curl"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -o "/tmp/gumdl/$ASSET" \
                 "https://github.com/frida/frida/releases/download/${VER}/${ASSET}"
          fi

          test -f "/tmp/gumdl/$ASSET"
          tar -xJf "/tmp/gumdl/$ASSET" -C frida/vendor
          test -f frida/vendor/libfrida-gum.a
          ls -lh frida/vendor

      - name: Strip bundled capstone from gum
        run: |
          set -eo pipefail
          # frida-gum 静态库内置了 capstone 5.x，仓库自带 x/capstone 6.0，两边
          # cs_open / Mapping / arch_* 全部重名，链接期直接 duplicate symbol。
          # 两者 ABI 不同（6.0 改过 cs_insn / cs_detail），不能简单二选一：
          #   - 保留 x/capstone：UCDisassembler 用 6.0 的头文件，实现必须与头一致；
          #   - 剥掉 gum 那份：让 gum 内部对 cs_* 的引用由 x/capstone 满足。
          # AiFlex3 不启用 Stalker，gum 的 relocator 不会在运行时调用 capstone，
          # 所以这个"借用"只发生在链接期，不产生 ABI 风险。
          WORK=$(mktemp -d)
          cp frida/vendor/libfrida-gum.a "$WORK/full.a"
          cd "$WORK"
          ar x full.a
          BEFORE=$(ls *.o | wc -l)
          # capstone 核心与各架构：核心文件名固定，架构成员是 arch_<大写架构>_*
          # （gum 自己的是 arch-arm64_ / arch-x86_ 小写带连字符，不会误伤）
          rm -f cs.c.o Mapping.c.o MCInst.c.o MCInstrDesc.c.o \
                MCRegisterInfo.c.o MCInstPrinter.c.o SStream.c.o utils.c.o
          rm -f arch_[A-Z]*.o
          AFTER=$(ls *.o | wc -l)
          echo "gum objects: $BEFORE -> $AFTER (dropped $((BEFORE-AFTER)) capstone objects)"
          test $((BEFORE-AFTER)) -gt 10
          ar rcs gum-stripped.a *.o
          cd "$OLDPWD"
          cp "$WORK/gum-stripped.a" frida/vendor/libfrida-gum.a
          ls -lh frida/vendor/libfrida-gum.a

      - name: Diagnose gum symbols
        run: |
          # 只做诊断不失败：gum 静态库内置一份 capstone，与仓库 x/capstone 同名符号
          # 只在被同时链接时冲突。本项目只用到 memory/module/backthread，不引用
          # stalker/relocator，理论上那些 .o 不会被拉入。这里把数量打出来便于排查。
          echo "gum 内置 capstone 符号数:"
          nm -gU frida/vendor/libfrida-gum.a 2>/dev/null | grep -cE ' _cs_(open|close|disasm)$' || echo 0
          echo "gum 导出 gum_ 符号数:"
          nm -gU frida/vendor/libfrida-gum.a 2>/dev/null | grep -c ' _gum_' || echo 0

      - name: Build AiFlex3
        run: make clean package FINALPACKAGE=1 DEBUG=0 -j1

      - name: List artifacts
        run: |
          ls -lh *.deb *.dylib

      - name: Upload dylib and deb
        uses: actions/upload-artifact@v4
        with:
          name: AiFlex3
          path: |
            *.deb
            *.dylib
          if-no-files-found: error
