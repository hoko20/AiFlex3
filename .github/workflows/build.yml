name: Build AiFlex3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-aiflex3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid xz
          xcodebuild -version

      # 不再调用 update-theos：它会 init 全部子模块，其中 theos/orion 已不再公开，
      # clone 时会退化成询问 Username 并直接失败（构建挂在 Install Theos）。
      # 按 .gitmodules 只拉构建必需的头文件/lib，dm.pl 与 logos 允许缺失。
      # 注意 vendor/include 的真实仓库是 theos/headers，不能按目录名拼 URL。
      - name: Install Theos
        run: |
          set -eo pipefail
          git clone --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          cd "$RUNNER_TEMP/theos"
          git submodule update --init --depth 1 vendor/include vendor/lib
          git submodule update --init --depth 1 vendor/dm.pl || echo "warning: vendor/dm.pl 不可用"
          git submodule update --init --depth 1 vendor/logos || echo "warning: vendor/logos 不可用"
          chmod +x vendor/dm.pl/dm.pl 2>/dev/null || true
          mkdir -p sdks
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" sdks/iPhoneOS.sdk
          test -d vendor/include && test -d vendor/lib
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/vendor/dm.pl" >> "$GITHUB_PATH"

      - name: Fetch frida-gum devkit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          # 版本不写死：release 的 tag 会变，写死容易 404。
          VER=$(curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" \
                https://api.github.com/repos/frida/frida/releases/latest | jq -r '.tag_name')
          echo "frida version: $VER"
          mkdir -p frida/vendor
          ASSET="frida-gum-devkit-${VER}-ios-arm64.tar.xz"
          rm -rf /tmp/gumdl && mkdir -p /tmp/gumdl

          # 匿名 GET /releases/download/... 会被 GitHub 限流成 403，
          # 所以主路径走 gh（认证 API），curl 只作为带 token 的兜底。
          if ! gh release download "$VER" --repo frida/frida --pattern "$ASSET" --dir /tmp/gumdl --clobber; then
            echo "gh release download 失败，改用带 token 的 curl"
            curl -fL --retry 5 --retry-delay 3 --retry-all-errors \
                 -H "Authorization: Bearer $GH_TOKEN" \
                 -o "/tmp/gumdl/$ASSET" \
                 "https://github.com/frida/frida/releases/download/${VER}/${ASSET}"
          fi

          test -f "/tmp/gumdl/$ASSET"
          tar -xJf "/tmp/gumdl/$ASSET" -C frida/vendor
          test -f frida/vendor/libfrida-gum.a
          ls -lh frida/vendor

      - name: Verify capstone headers
        run: |
          # 5.0.1 头给 gum 侧（gum 内置实现就是 5.0.1）；6.0 头给 UCDisassembler。
          # 两套 cs_detail 布局不同（union 偏移 92 vs 154），不能混用。
          echo "5.0.1 header (gum side):"
          grep -m1 "CS_API_MAJOR" x/capstone/include/capstone/capstone.h
          echo "6.0 header (disasm side):"
          grep -m1 "CS_API_MAJOR" x/capstone6/include/capstone/capstone.h
          if grep -qE "^\s*CAPSTONE_(CORE|ARCH)\s*=" Makefile; then
            echo "Makefile 仍在收集 x/capstone 源码，会与 gum 内置 capstone 冲突"
            exit 1
          fi
          stray=$(find x/capstone -type f -not -path "x/capstone/include/*" | wc -l | tr -d ' ')
          if [ "$stray" != "0" ]; then
            echo "x/capstone 下除 include/ 外不应再有文件，实际 $stray 个："
            find x/capstone -type f -not -path "x/capstone/include/*"
            exit 1
          fi
          # 6.0 源码必须走 scripts/build-capstone6.sh 单独编译，
          # 直接进 Theos 的 *_FILES 会带上未前缀的 cs_* 符号。
          if grep -q "x/capstone6/" Makefile; then
            echo "Makefile 引用了 x/capstone6，确认只出现在 grep -v 排除行和 CAPSTONE6_LIB 定义里"
          fi

      - name: Build capstone 6 (prefixed symbols)
        run: |
          bash scripts/build-capstone6.sh
          test -f x/capstone6/lib/libcapstone6.a
          echo "prefixed _flx6_cs_open:"
          nm -gU x/capstone6/lib/libcapstone6.a 2>/dev/null | grep -c ' _flx6_cs_open$' || true
          n=$(nm -gU x/capstone6/lib/libcapstone6.a 2>/dev/null | grep -cE ' _cs_(open|close|disasm|free)$' || true)
          if [ "$n" != "0" ]; then
            echo "capstone6 里仍有 $n 个未加前缀的 cs_* 符号，会与 gum 冲突"
            exit 1
          fi

      - name: Diagnose gum symbols
        run: |
          # aiflex_hook 走 gum Interceptor，arm64 侧经 relocator 重定位被覆盖
          # 的指令，relocator 直接引用 cs_arch_register_arm64 —— 这份 5.0.1
          # 实现剥不掉，只能靠 flx6 前缀让 6.0 与之并存。
          echo "gum 内置 capstone 符号数:"
          nm -gU frida/vendor/libfrida-gum.a 2>/dev/null | grep -cE ' _cs_(open|close|disasm)$' || echo 0
          echo "gum 导出 gum_ 符号数:"
          nm -gU frida/vendor/libfrida-gum.a 2>/dev/null | grep -c ' _gum_' || echo 0

      - name: Build AiFlex3
        run: make clean package FINALPACKAGE=1 DEBUG=0 -j1

      - name: List artifacts
        run: |
          ls -lh *.deb *.dylib

      - name: Upload dylib and deb
        uses: actions/upload-artifact@v4
        with:
          name: AiFlex3
          path: |
            *.deb
            *.dylib
          if-no-files-found: error
