name: Build AiFlex3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-aiflex3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid xz
          xcodebuild -version

      # 不再调用 update-theos：它会 init 全部子模块，其中 theos/orion 已不再公开，
      # clone 时会退化成询问 Username 并直接失败（构建挂在 Install Theos）。
      # 按 .gitmodules 只拉构建必需的头文件/lib，dm.pl 与 logos 允许缺失。
      # 注意 vendor/include 的真实仓库是 theos/headers，不能按目录名拼 URL。
      - name: Install Theos
        run: |
          set -eo pipefail
          git clone --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          cd "$RUNNER_TEMP/theos"
          git submodule update --init --depth 1 vendor/include vendor/lib
          git submodule update --init --depth 1 vendor/dm.pl || echo "warning: vendor/dm.pl 不可用"
          git submodule update --init --depth 1 vendor/logos || echo "warning: vendor/logos 不可用"
          chmod +x vendor/dm.pl/dm.pl 2>/dev/null || true
          mkdir -p sdks
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" sdks/iPhoneOS.sdk
          test -d vendor/include && test -d vendor/lib
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/vendor/dm.pl" >> "$GITHUB_PATH"

      - name: Build AiFlex3
        run: make clean package FINALPACKAGE=1 DEBUG=0 -j1

      - name: List artifacts
        run: |
          ls -lh *.deb *.dylib

      - name: Upload dylib and deb
        uses: actions/upload-artifact@v4
        with:
          name: AiFlex3
          path: |
            *.deb
            *.dylib
          if-no-files-found: error
