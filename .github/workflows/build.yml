name: Build AiFlex3

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-aiflex3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          brew install ldid xz
          xcodebuild -version

      # 不再调用 update-theos：它会 init 全部子模块，其中 theos/orion 已不再公开，
      # clone 时会退化成询问 Username 并直接失败（构建挂在 Install Theos）。
      # 按 .gitmodules 只拉构建必需的头文件/lib，dm.pl 与 logos 允许缺失。
      # 注意 vendor/include 的真实仓库是 theos/headers，不能按目录名拼 URL。
      - name: Install Theos
        run: |
          set -eo pipefail
          git clone --depth 1 https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          cd "$RUNNER_TEMP/theos"
          git submodule update --init --depth 1 vendor/include vendor/lib
          git submodule update --init --depth 1 vendor/dm.pl || echo "warning: vendor/dm.pl 不可用"
          git submodule update --init --depth 1 vendor/logos || echo "warning: vendor/logos 不可用"
          chmod +x vendor/dm.pl/dm.pl 2>/dev/null || true
          mkdir -p sdks
          ln -sfn "$(xcrun --sdk iphoneos --show-sdk-path)" sdks/iPhoneOS.sdk
          test -d vendor/include && test -d vendor/lib
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/vendor/dm.pl" >> "$GITHUB_PATH"

      - name: Fetch frida-gum devkit
        run: |
          set -eo pipefail
          # 版本不写死：release 的 tag 会变，写死容易 404；先取 latest 再按资产名回退。
          VER=$(curl -fsSL https://api.github.com/repos/frida/frida/releases/latest | jq -r '.tag_name')
          echo "frida version: $VER"
          mkdir -p frida/vendor
          ASSET="frida-gum-devkit-${VER}-ios-arm64.tar.xz"
          URL="https://github.com/frida/frida/releases/download/${VER}/${ASSET}"
          if ! curl -fL --retry 3 -o /tmp/gum.tar.xz "$URL"; then
            echo "精确资产名不可用，改从资产列表匹配"
            ALT=$(curl -fsSL "https://api.github.com/repos/frida/frida/releases/tags/${VER}" \
                  | jq -r '.assets[].browser_download_url' \
                  | grep -E 'gum-devkit.*ios-arm64' | head -1)
            test -n "$ALT"
            echo "using $ALT"
            curl -fL --retry 3 -o /tmp/gum.tar.xz "$ALT"
          fi
          tar -xJf /tmp/gum.tar.xz -C frida/vendor
          test -f frida/vendor/libfrida-gum.a
          ls -lh frida/vendor

      - name: Diagnose gum symbols
        run: |
          # 只做诊断不失败：gum 静态库内置一份 capstone，与仓库 x/capstone 同名符号
          # 只在被同时链接时冲突。本项目只用到 memory/module/backthread，不引用
          # stalker/relocator，理论上那些 .o 不会被拉入。这里把数量打出来便于排查。
          echo "gum 内置 capstone 符号数:"
          nm -gU frida/vendor/libfrida-gum.a 2>/dev/null | grep -cE ' _cs_(open|close|disasm)$' || echo 0
          echo "gum 导出 gum_ 符号数:"
          nm -gU frida/vendor/libfrida-gum.a 2>/dev/null | grep -c ' _gum_' || echo 0

      - name: Build AiFlex3
        run: make clean package FINALPACKAGE=1 DEBUG=0 -j1

      - name: List artifacts
        run: |
          ls -lh *.deb *.dylib

      - name: Upload dylib and deb
        uses: actions/upload-artifact@v4
        with:
          name: AiFlex3
          path: |
            *.deb
            *.dylib
          if-no-files-found: error
